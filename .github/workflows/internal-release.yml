name: Internal Testing Release

on:
  # Manual trigger from the Actions tab.
  workflow_dispatch:
  # Uncomment to also release on every push to master:
  # push:
  #   branches: [master]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is derived from `git rev-list --count HEAD`,
          # so the full history is required — a shallow clone would
          # produce versionCode 1 and Play would reject the upload.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Create local.properties
        run: |
          cat > local.properties << EOF
          RELEASE_STORE_FILE=$RUNNER_TEMP/upload-keystore.jks
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          GOOGLE_SERVER_CLIENT_ID_RELEASE=${{ secrets.GOOGLE_SERVER_CLIENT_ID_RELEASE }}
          GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          EOF

      - name: Build release bundle
        run: ./gradlew :app:bundleRelease

      - name: Upload to Play internal testing track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dk.zlatan.flotmand
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed